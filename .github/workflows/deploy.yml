name: Deploy QuantsMind to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    name: Build Angular Application
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '^22.22.3'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test -- --watch=false

      - name: Set up Chrome for prerendering
        id: setup-chrome
        uses: browser-actions/setup-chrome@v2.2.0
        with:
          chrome-version: stable

      - name: Build production bundle
        run: npm run build -- --configuration=production --base-href=/

      - name: Prerender static HTML for every public route
        # Serves the built app in headless Chrome and writes real HTML to
        # <route>/index.html, so crawlers and link unfurlers receive
        # route-specific metadata and GitHub Pages answers deep links with
        # HTTP 200. The same pass writes 404.html from the wildcard route.
        env:
          CHROME_PATH: ${{ steps.setup-chrome.outputs.chrome-path }}
        run: npm run prerender

      - name: Verify prerendered HTML, metadata and 404 document
        run: npm run test:prerender

      - name: Responsive smoke test (all routes × six widths)
        env:
          CHROME_PATH: ${{ steps.setup-chrome.outputs.chrome-path }}
        run: npm run smoke

      - name: Create CNAME file for custom domain
        run: echo "www.quantsmind.com" > dist/quantsmind-web/browser/CNAME

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist/quantsmind-web/browser

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
