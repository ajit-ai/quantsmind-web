<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 176 40" width="176" height="40" fill="none"
     role="img" aria-labelledby="qmLogoTitle">
  <title id="qmLogoTitle">QuantsMind</title>
  <!--
    QuantsMind primary lockup — symbol + wordmark, for light surfaces.
    The site header renders the wordmark as HTML text using the design system's
    type scale; this file is the standalone brand lockup.
  -->
  <g transform="translate(2 4)" stroke="#1D4ED8" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="10.5" cy="10.5" r="7" stroke-width="2.1"/>
    <path d="M14.9 14.9 19.8 19.8" stroke-width="2.3"/>
    <path d="M7.1 9.2 11.3 6.5 13.3 11.4" stroke-width="0.95" opacity="0.55"/>
  </g>
  <g transform="translate(2 4)" fill="#1D4ED8">
    <circle cx="7.1" cy="9.2" r="1.25"/>
    <circle cx="11.3" cy="6.5" r="1"/>
    <circle cx="13.3" cy="11.4" r="1.25"/>
  </g>
  <text x="34" y="26"
        font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif"
        font-size="19" font-weight="700" letter-spacing="-0.5"
        fill="#0F172A">QuantsMind</text>
</svg>