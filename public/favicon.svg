<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" fill="none"
     role="img" aria-labelledby="qmFavTitle">
  <title id="qmFavTitle">QuantsMind</title>
  <!--
    QuantsMind favicon — the site header logo mark on the brand tile.
    Tile gradient matches --color-accent / --color-accent-indigo (#2563EB -> #4F46E5).
    Full-bleed square so it stays legible on any browser tab background.
  -->
  <defs>
    <linearGradient id="qmTile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2563EB"/>
      <stop offset="1" stop-color="#4F46E5"/>
    </linearGradient>
  </defs>
  <rect width="48" height="48" fill="url(#qmTile)"/>
  <g transform="translate(0.3 0.3) scale(1.94)" stroke="#FFFFFF" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="10.5" cy="10.5" r="7" stroke-width="2.1"/>
    <path d="M14.9 14.9 19.8 19.8" stroke-width="2.3"/>
    <path d="M7.1 9.2 11.3 6.5 13.3 11.4" stroke-width="0.95" opacity="0.55"/>
  </g>
  <g transform="translate(0.3 0.3) scale(1.94)" fill="#FFFFFF">
    <circle cx="7.1" cy="9.2" r="1.25"/>
    <circle cx="11.3" cy="6.5" r="1"/>
    <circle cx="13.3" cy="11.4" r="1.25"/>
  </g>
</svg>